konvi:
  port: ${PORT:8080}
  database:
    url: ${DB_URL:jdbc:h2:file:./data/sample}
    driver: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  cors:
    allowedOrigins:
      - "http://localhost:3000"
  auth:
    jwt:
      secret: ${JWT_SECRET:change-me}
      issuer: konvi-sample
      audience: konvi-sample
      realm: Konvi
      expiresInSeconds: 3600
